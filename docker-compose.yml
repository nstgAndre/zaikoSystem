version: '3'
services:
  web:
    image: nginx:1.15.6
    ports:
      - '8000:80'
    depends_on:
      - app
    volumes:
      - ./docker/web/default.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
  app:
    build: ./docker/php
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
    ports:
      - "5173:5173"
    working_dir: /var/www/html/src
  # --- リプレイス後スタック (Bun + Hono + React SPA) ---
  api:
    image: oven/bun:1
    working_dir: /workspace
    command: sh -c "bun install && cd apps/api && bun run dev"
    volumes:
      - .:/workspace
    ports:
      - "3000:3000"
    depends_on:
      - postgres
  spa:
    image: oven/bun:1
    working_dir: /workspace
    command: sh -c "bun install && cd apps/web && bunx vite --host 0.0.0.0"
    volumes:
      - .:/workspace
    ports:
      - "5174:5174"
    depends_on:
      - api
  postgres:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      PGPASSWORD: password123
      POSTGRES_DB: sample
      TZ: "Asia/Tokyo"
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql/data
  
volumes:
  postgres: